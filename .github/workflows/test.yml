name: test

on:
  pull_request:
  push:
    branches: [main]

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      - run: make lint
      - run: go test -race -count=1 ./...
      # The int8 re-rank's SIMD version is behind GOEXPERIMENT=simd; check it
      # builds and matches the plain-Go version.
      - run: GOEXPERIMENT=simd go test -count=1 ./internal/vec/

  python:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      - run: make python-lint
      - run: make python-test
      # Go verifies what Python signed and encoded (python/tests/fixtures/python.json).
      - run: go test -count=1 -run 'TestPythonFixtures' ./internal/lex/

  web:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          package_json_file: web/package.json
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
          cache-dependency-path: web/pnpm-lock.yaml
      - run: make web
      - run: make web-test
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      # The binary with the frontend embedded.
      - run: go build -o /tmp/engram-web ./cmd/engram-web
