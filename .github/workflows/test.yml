name: test

on:
  pull_request:
  push:
    branches: [main]

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      - run: make lint
      - run: go test -race -count=1 ./...
      # The int8 re-rank's SIMD version is behind GOEXPERIMENT=simd; check it
      # builds and matches the plain-Go version.
      - run: GOEXPERIMENT=simd go test -count=1 ./internal/vec/
